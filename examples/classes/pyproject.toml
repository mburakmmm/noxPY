[build-system]
requires = ["noxpy>=0.3.0a1"]
build-backend = "noxpy.build"

[project]
name = "noxpy-classes"
version = "0.3.0a1"
description = "NoxPy Phase 3 example package exposing native @export classes, properties, and custom exceptions."
requires-python = ">=3.15"

[tool.noxpy]
module-name = "classes_demo"
source = "src/lib.nox"
backend = "llvm"
abi = "abi3t"
free-threaded = true
generate-stubs = true
