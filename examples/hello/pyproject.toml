[build-system]
requires = ["noxpy>=0.1.0a1"]
build-backend = "noxpy.build"

[project]
name = "noxpy-hello"
version = "0.1.0a1"
description = "Minimal Phase 1 NoxPy native extension example."
requires-python = ">=3.15"

[tool.noxpy]
module-name = "hello"
source = "src/hello.nox"
backend = "llvm"
abi = "abi3t"
free-threaded = true
generate-stubs = true
