[build-system]
requires = ["noxpy>=0.1.0a1"]
build-backend = "noxpy.build"

[project]
name = "noxpy-noxen"
version = "0.6.0a1"
description = "Noxen-inspired native schema and record validation example built with NoxPy"
requires-python = ">=3.15"

[tool.noxpy]
module-name = "noxen_demo"
source = "src/lib.nox"
backend = "llvm"
abi = "abi3t"
free-threaded = true
generate-stubs = true
