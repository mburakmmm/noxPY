name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify/publish (must match pyproject.toml & CHANGELOG.md)"
        required: true
        type: string
      dry_run:
        description: "Verify & build immutable artifacts without publishing"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-gate:
    name: Release Gate & Preflight Tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      phase: ${{ steps.gate.outputs.phase }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      pypi_allowed: ${{ steps.gate.outputs.pypi_allowed }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Evaluate release gate & extract changelog notes
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          else
            TAG="${{ inputs.tag }}"
            DRY_RUN="${{ inputs.dry_run }}"
          fi
          mkdir -p release_meta
          GATE_JSON="$(python scripts/release/check_release_gate.py --tag "$TAG" --extract-notes release_meta/RELEASE_NOTES.md --json)"
          echo "$GATE_JSON"
          python - <<'PY' "$GATE_JSON" "$DRY_RUN" >> "$GITHUB_OUTPUT"
          import json, sys
          data = json.loads(sys.argv[1])
          print(f"tag={data['tag']}")
          print(f"version={data['version']}")
          print(f"phase={data['phase']}")
          print(f"prerelease={str(data['prerelease']).lower()}")
          print(f"pypi_allowed={str(data['pypi_allowed']).lower()}")
          print(f"dry_run={sys.argv[2]}")
          PY
      - name: Run full unit & codegen suites
        run: |
          python -m unittest discover -s tests/unit -v
          python -m unittest discover -s tests/codegen -v
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-notes
          path: release_meta/RELEASE_NOTES.md

  build-artifacts:
    name: Build Reproducible Distribution Artifacts
    needs: [preflight-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Build sdist and wheel with SOURCE_DATE_EPOCH
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m pip install --upgrade build
          python -m build --outdir dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          python scripts/release/check_release_gate.py \
            --tag "${{ needs.preflight-gate.outputs.tag }}" \
            --artifacts-dir dist \
            --write-manifest dist/release-manifest.json
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-artifacts
          path: dist/

  verify-immutable-artifacts:
    name: Clean-Env Install Check (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [preflight-gate, build-artifacts]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.15", "3.15t"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifacts
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Verify immutable SHA-256 checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS.txt
          else
            shasum -a 256 -c SHA256SUMS.txt
          fi
      - name: Install wheel into isolated venv and run smoke checks
        run: |
          python -m venv .venv_smoke
          .venv_smoke/bin/python -m pip install --no-index --find-links dist noxpy
          .venv_smoke/bin/noxpy doctor --json
          if [ "${{ matrix.python-version }}" = "3.15t" ]; then
            .venv_smoke/bin/python -c "import sys, noxpy; assert not sys._is_gil_enabled()"
          fi

  publish-github-release:
    name: Attest & Publish GitHub Release
    needs: [preflight-gate, build-artifacts, verify-immutable-artifacts]
    if: needs.preflight-gate.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight-gate.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifacts
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release_meta
      - name: Verify checksums before attestation
        run: (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.preflight-gate.outputs.tag }}
          name: "NoxPy ${{ needs.preflight-gate.outputs.tag }}"
          body_path: release_meta/RELEASE_NOTES.md
          prerelease: ${{ needs.preflight-gate.outputs.prerelease }}
          files: dist/*

  publish-pypi:
    name: Publish to PyPI (Phase 1+ OIDC Trusted Publishing)
    needs: [preflight-gate, build-artifacts, verify-immutable-artifacts, publish-github-release]
    if: needs.preflight-gate.outputs.dry_run == 'false' && needs.preflight-gate.outputs.pypi_allowed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/noxpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifacts
          path: dist
      - name: Keep only wheel & sdist for PyPI upload
        run: |
          rm -f dist/SHA256SUMS.txt dist/release-manifest.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
