name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene-and-workflows:
    name: Hygiene, Config & Workflow Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Run workflow & release-gate policy tests
        run: python -m unittest tests/unit/test_workflows.py tests/unit/test_release_gate.py -v
      - name: Validate JSON hook configs
        run: |
          python -c 'import json, pathlib; [json.loads(pathlib.Path(p).read_text()) for p in (".agents/hooks.json", ".agents/plugins/rtk/hooks.json", ".claude/settings.json")]'
      - name: Verify fail-closed build gate & doctor JSON
        env:
          PYTHONPATH: python
        run: |
          python -m noxpy doctor --json

  python-unit-and-codegen:
    name: Unit & Codegen (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Run unit tests (pure Python + native shim where supported)
        run: python -m unittest discover -s tests/unit -v
      - name: Run codegen tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests/codegen -v

  native-abi3t-shim-dual-mode:
    name: Native abi3t Single-Binary Dual-Mode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py_gil
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py_ft
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - name: Build single abi3t test extension once (-Werror)
        run: |
          mkdir -p build_ci
          PY_INC="$("${{ steps.py_gil.outputs.python-path }}" -c "import sysconfig; print(sysconfig.get_path('include'))")"
          if [ "${{ runner.os }}" = "macOS" ]; then
            printf "_PyModExport__noxpy_shim_test\n" > build_ci/exports.txt
            LINK_FLAGS="-bundle -undefined dynamic_lookup -Wl,-exported_symbols_list,build_ci/exports.txt"
          else
            printf "{\n  global: PyModExport__noxpy_shim_test;\n  local: *;\n};\n" > build_ci/exports.ver
            LINK_FLAGS="-shared -Wl,--version-script,build_ci/exports.ver"
          fi
          clang -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden \
            $LINK_FLAGS \
            -Inative/include "-I$PY_INC" \
            -o build_ci/_noxpy_shim_test.abi3t.so \
            tests/unit/shim_test_ext.c native/cpython/noxpy_shim.c
          shasum -a 256 build_ci/_noxpy_shim_test.abi3t.so || sha256sum build_ci/_noxpy_shim_test.abi3t.so
      - name: Audit abi3t symbols and dependencies
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            SYM="_PyModExport__noxpy_shim_test"
          else
            SYM="PyModExport__noxpy_shim_test"
          fi
          "${{ steps.py_gil.outputs.python-path }}" tests/abi/audit_binary.py build_ci/_noxpy_shim_test.abi3t.so "$SYM"
      - name: Verify exact same binary on ordinary CPython 3.15
        env:
          PYTHONPATH: build_ci
        run: |
          "${{ steps.py_gil.outputs.python-path }}" -c 'import sys, _noxpy_shim_test as m; assert sys._is_gil_enabled(); assert m.rt_i64(42) == 42; assert m.rt_str("a\x00b") == "a\x00b"'
      - name: Verify exact same binary on unforced free-threaded CPython 3.15t
        env:
          PYTHONPATH: build_ci
        run: |
          "${{ steps.py_ft.outputs.python-path }}" -c 'import sys, _noxpy_shim_test as m; assert not sys._is_gil_enabled(), "did not start free-threaded"; assert m.rt_i64(42) == 42; assert m.rt_str("a\x00b") == "a\x00b"; assert not sys._is_gil_enabled(), "extension re-enabled GIL!"'
      - name: Run CPython shim under ASan/UBSan
        run: |
          mkdir -p build_ci_san
          PY_INC="$("${{ steps.py_gil.outputs.python-path }}" -c "import sysconfig; print(sysconfig.get_path('include'))")"
          if [ "${{ runner.os }}" = "macOS" ]; then
            printf "_PyModExport__noxpy_shim_test\n" > build_ci_san/exports.txt
            clang -std=c11 -O1 -g -Wall -Wextra -Werror -fPIC -fvisibility=hidden \
              -fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
              -bundle -undefined dynamic_lookup -Wl,-exported_symbols_list,build_ci_san/exports.txt \
              -Inative/include "-I$PY_INC" \
              -o build_ci_san/_noxpy_shim_test.abi3t.so \
              tests/unit/shim_test_ext.c native/cpython/noxpy_shim.c
            PYTHONPATH=build_ci_san UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "${{ steps.py_gil.outputs.python-path }}" -c 'import _noxpy_shim_test as m; assert m.rt_i64(42) == 42; assert m.rt_str("a\x00b") == "a\x00b"'
            PYTHONPATH=build_ci_san UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "${{ steps.py_ft.outputs.python-path }}" -c 'import sys, _noxpy_shim_test as m; assert not sys._is_gil_enabled(); assert m.rt_i64(42) == 42; assert m.rt_str("a\x00b") == "a\x00b"; assert not sys._is_gil_enabled()'
          else
            printf "{\n  global: PyModExport__noxpy_shim_test;\n  local: *;\n};\n" > build_ci_san/exports.ver
            gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fPIC -fvisibility=hidden \
              -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
              -shared -Wl,--version-script,build_ci_san/exports.ver \
              -Inative/include "-I$PY_INC" \
              -o build_ci_san/_noxpy_shim_test.abi3t.so \
              tests/unit/shim_test_ext.c native/cpython/noxpy_shim.c
            ASAN_LIB="$(gcc -print-file-name=libasan.so)"
            LD_PRELOAD="$ASAN_LIB" \
              ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
              UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              PYTHONPATH=build_ci_san \
              "${{ steps.py_gil.outputs.python-path }}" -c 'import _noxpy_shim_test as m; assert m.rt_i64(42) == 42; assert m.rt_str("a\x00b") == "a\x00b"'
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abi3t-shim-${{ runner.os }}
          path: build_ci/_noxpy_shim_test.abi3t.so

  native-nox-end-to-end:
    name: Native Nox Toolchain E2E (${{ matrix.os }} / v2.2.95)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py_gil
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py_ft
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - name: Install SHA-256 verified nox-lang v2.2.95
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nox-lang" /tmp/nox-dl
          if [ "${{ runner.os }}" = "macOS" ]; then
            URL="https://github.com/mburakmmm/nox-lang/releases/download/v2.2.95/nox-lang-v2.2.95-macos-arm64.tar.gz"
            SHA="f0a8e51edadbb8533153d0834334e397188f669cc8943dc9c5c09aab504d6234"
            TAR="/tmp/nox-dl/nox.tar.gz"
            curl -fsSL "$URL" -o "$TAR"
            echo "$SHA  $TAR" | shasum -a 256 -c -
          else
            URL="https://github.com/mburakmmm/nox-lang/releases/download/v2.2.95/nox-lang-v2.2.95-linux-x64.tar.gz"
            SHA="8b49098bf6c5b6072e58a7246ced294dd7888ad614099920ba5cfd4190942539"
            TAR="/tmp/nox-dl/nox.tar.gz"
            curl -fsSL "$URL" -o "$TAR"
            echo "$SHA  $TAR" | sha256sum -c -
          fi
          tar -xzf "$TAR" --strip-components=1 -C "$HOME/.nox-lang"
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"
          "$HOME/.nox-lang/bin/noxc" --version
      - name: Install uv
        run: |
          "${{ steps.py_gil.outputs.python-path }}" -m pip install --quiet uv
      - name: Run Nox language tests, fuzz, Phase 3A heap types, and Phase 1–6 real wheels
        env:
          NOXPY_REQUIRE_NATIVE: "1"
          NOXPY_PYTHON_315T: ${{ steps.py_ft.outputs.python-path }}
        run: |
          noxc test tests/nox
          "${{ steps.py_gil.outputs.python-path }}" -m unittest discover -s tests/fuzz -v
          "${{ steps.py_gil.outputs.python-path }}" -m unittest tests/unit/test_phase3_heap_types.py -v
          "${{ steps.py_gil.outputs.python-path }}" -m unittest tests/packaging/test_phase1_wheels.py tests/packaging/test_phase2_packaging.py tests/packaging/test_phase3_classes.py tests/packaging/test_phase4_callbacks_async.py tests/packaging/test_phase5_buffers_atlas.py tests/packaging/test_phase6_arrow_noxen_subinterp.py tests/packaging/test_phase6_5_hardening.py tests/packaging/test_phase6_5_universal_packages.py tests/stress/test_phase7a_soak.py -v
      - name: Verify pinned real upstream Noxen E2E (3.15 + 3.15t)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          git clone --quiet https://github.com/mburakmmm/noxen.git "$WORK/noxen"
          git -C "$WORK/noxen" checkout --quiet 92b341226b0dd3f04dd9f49e06cce3dc7c286bd1
          "${{ steps.py_gil.outputs.python-path }}" -m noxpy init \
            --from-nox-package "$WORK/noxen" \
            --out "$WORK/noxen_wrap" \
            --module-name noxen_upstream \
            --modules validators \
            --select is_valid_email,is_valid_date,is_valid_time,is_valid_ipv4,is_valid_int \
            --portable --fetch --json
          "${{ steps.py_gil.outputs.python-path }}" -m noxpy build "$WORK/noxen_wrap" --out-dir "$WORK/dist" --release --json
          WHL="$(ls "$WORK"/dist/noxpy_noxen-*.whl)"
          IDX=0
          for PY in "${{ steps.py_gil.outputs.python-path }}" "${{ steps.py_ft.outputs.python-path }}"; do
            IDX=$((IDX + 1))
            V="$WORK/venv_$IDX"
            uv venv --quiet --python "$PY" "$V"
            uv pip install --quiet --python "$V/bin/python" "$WHL"
            "$V/bin/python" -c 'import noxen_upstream as nx; assert nx.is_valid_email("alice@example.org") is True; assert nx.is_valid_ipv4("192.168.1.1") is True'
          done
      - name: Verify Linux manylinux glibc audit & full-runtime UBSan link
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cp -r examples/hello "$WORK/hello"
          NOXPY_PLATFORM_TAG=manylinux_2_28_x86_64 NOXPY_MAX_GLIBC=2.39 \
            "${{ steps.py_gil.outputs.python-path }}" -m noxpy build "$WORK/hello" --out-dir "$WORK/dist" --release --json
          ls "$WORK"/dist/*-cp315-abi3.abi3t-manylinux_2_28_x86_64.whl

          PY_INC="$("${{ steps.py_gil.outputs.python-path }}" -c "import sysconfig; print(sysconfig.get_path('include'))")"
          NOX_INC="$HOME/.nox-lang/include"
          NOXRT="$HOME/.nox-lang/lib/noxrt.o"
          noxc build --backend llvm --host-abi --module-name hello --emit-obj -o "$WORK/hello_nox.o" "$WORK/hello/src/lib.nox"
          "${{ steps.py_gil.outputs.python-path }}" -m noxpy generate-stubs "$WORK/hello" --emit-c > "$WORK/hello_adapter.c"
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fPIC -fvisibility=hidden \
            -fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -shared -I"$PWD/native/include" -I"$NOX_INC" -I"$PY_INC" \
            -o "$WORK/hello.abi3t.so" "$WORK/hello_adapter.c" native/cpython/noxpy_shim.c "$WORK/hello_nox.o" "$NOXRT" -lm -lpthread
          PYTHONPATH="$WORK" UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            "${{ steps.py_gil.outputs.python-path }}" -c 'import hello; assert hello.add(20, 22) == 42'
          PYTHONPATH="$WORK" UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            "${{ steps.py_ft.outputs.python-path }}" -c 'import sys, hello; assert not sys._is_gil_enabled(); assert hello.add(20, 22) == 42; assert not sys._is_gil_enabled()'

  windows-nox-native-e2e:
    name: Windows Native .pyd E2E (windows-latest / v2.2.95)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py_gil
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py_ft
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - name: Install SHA-256 verified nox-lang v2.2.95 (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "nox-lang-windows-x64.zip"
          $url = "https://github.com/mburakmmm/nox-lang/releases/download/v2.2.95/nox-lang-v2.2.95-windows-x64.zip"
          $expected = "2e9ee9b66cc2ba6e96d85651fdbfb5996c90dd1e942c9e0d91a37be8a7bdc956"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch: expected $expected, got $actual" }
          $dest = Join-Path $env:USERPROFILE ".nox-lang"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $noxcExe = Get-ChildItem -Path $dest -Filter "noxc.exe" -Recurse | Select-Object -First 1
          if (-not $noxcExe) { throw "noxc.exe not found inside extracted $dest" }
          $noxcExe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $noxcExe.FullName --version
      - name: Install uv
        shell: pwsh
        run: |
          & "${{ steps.py_gil.outputs.python-path }}" -m pip install --quiet uv
      - name: Run Nox language tests, Python unit suite, and Windows .pyd dual-mode wheel E2E
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\python
        run: |
          $ErrorActionPreference = "Stop"
          noxc test tests/nox
          & "${{ steps.py_gil.outputs.python-path }}" -m unittest discover -s tests/unit -v
          $work = Join-Path $env:RUNNER_TEMP "noxpy-win-e2e"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Path $work | Out-Null
          Copy-Item -Recurse "examples\hello" "$work\hello"
          & "${{ steps.py_gil.outputs.python-path }}" -m noxpy build "$work\hello" --out-dir "$work\dist" --release --json
          $whl = (Get-ChildItem "$work\dist\hello-*-cp315-abi3.abi3t-win_amd64.whl" | Select-Object -First 1).FullName
          if (-not $whl) { throw "Expected win_amd64 dual-tag wheel not found" }
          foreach ($pair in @(@("315", "${{ steps.py_gil.outputs.python-path }}", "True"), @("315t", "${{ steps.py_ft.outputs.python-path }}", "False"))) {
            $lbl = $pair[0]; $py = $pair[1]; $expGil = $pair[2]
            $vdir = "$work\venv-$lbl"
            uv venv --quiet --python $py $vdir
            uv pip install --quiet --python "$vdir\Scripts\python.exe" $whl
            & "$vdir\Scripts\python.exe" -c "import sys, hello; assert sys._is_gil_enabled() is $expGil; assert hello.add(20, 22) == 42; assert sys._is_gil_enabled() is $expGil; print('WIN_PYD_OK', sys._is_gil_enabled())"
          }

  ci-summary:
    name: CI Gate Summary
    needs: [hygiene-and-workflows, python-unit-and-codegen, native-abi3t-shim-dual-mode, native-nox-end-to-end, windows-nox-native-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Report CI pass
        run: echo "All required NoxPy CI gates passed."
