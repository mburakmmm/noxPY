[build-system]
requires = ["noxpy>=0.4.0a1"]
build-backend = "noxpy.build"

[project]
name = "noxpy-callbacks-async"
version = "0.4.0a1"
description = "NoxPy Phase 4 example package covering HostObject callbacks, async/await asyncio.Future bridging, and iterators."
requires-python = ">=3.15"

[tool.noxpy]
module-name = "callbacks_async_demo"
source = "src/lib.nox"
backend = "llvm"
abi = "abi3t"
free-threaded = true
generate-stubs = true
