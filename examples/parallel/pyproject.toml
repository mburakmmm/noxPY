[build-system]
requires = ["noxpy>=0.3.0a1"]
build-backend = "noxpy.build"

[project]
name = "noxpy-parallel"
version = "0.3.0a1"
description = "NoxPy Phase 3 parallel & instance_locked native classes benchmarked under CPython 3.15t."
requires-python = ">=3.15"

[tool.noxpy]
module-name = "parallel_demo"
source = "src/lib.nox"
backend = "llvm"
abi = "abi3t"
free-threaded = true
generate-stubs = true
